name: Build

on:
  push:
    branches: ['main', 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle build --stacktrace

      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: Reality-Unfolded-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
