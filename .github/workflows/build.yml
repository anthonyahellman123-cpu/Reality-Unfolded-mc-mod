name: Build Reality Unfolded POC

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant wrapper permission
        run: chmod +x gradlew
      - name: Test and build
        run: ./gradlew test build --stacktrace
      - name: Upload testable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reality-unfolded-poc
          path: build/libs/*.jar
          if-no-files-found: error
